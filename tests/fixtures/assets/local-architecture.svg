<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">LeanMark local rendering architecture</title>
  <desc id="description">A Markdown file flows through a native parser into a locked-down reader and a local Mermaid renderer.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7" />
      <stop offset="1" stop-color="#e9e4d8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5c34" />
    </marker>
  </defs>
  <rect width="960" height="300" rx="28" fill="url(#paper)" />
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g transform="translate(55 78)">
      <rect width="210" height="142" rx="18" fill="#fff" stroke="#8e7758" stroke-width="3" />
      <text x="105" y="58" font-size="27" font-weight="700" fill="#2f2922">Markdown file</text>
      <text x="105" y="91" font-size="17" fill="#665b4f">Local content + assets</text>
    </g>
    <path d="M 280 149 H 354" fill="none" stroke="#7c5c34" stroke-width="4" marker-end="url(#arrow)" />
    <g transform="translate(370 78)">
      <rect width="220" height="142" rx="18" fill="#273e3b" />
      <text x="110" y="58" font-size="27" font-weight="700" fill="#fff">Native parser</text>
      <text x="110" y="91" font-size="17" fill="#d9ebe7">GFM · raw HTML off</text>
    </g>
    <path d="M 605 149 H 679" fill="none" stroke="#7c5c34" stroke-width="4" marker-end="url(#arrow)" />
    <g transform="translate(695 78)">
      <rect width="210" height="142" rx="18" fill="#9a5b42" />
      <text x="105" y="58" font-size="27" font-weight="700" fill="#fff">Reader view</text>
      <text x="105" y="91" font-size="17" fill="#fff4ed">Strict local diagrams</text>
    </g>
  </g>
</svg>
