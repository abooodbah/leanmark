<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("../site/assets/fonts/ibm-plex-sans-latin-500-normal.woff2");
      font-weight: 500;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("../site/assets/fonts/ibm-plex-sans-latin-600-normal.woff2");
      font-weight: 600;
    }
    @font-face {
      font-family: "IBM Plex Serif";
      src: url("../site/assets/fonts/ibm-plex-serif-latin-600-normal.woff2");
      font-weight: 600;
    }
    * { box-sizing: border-box; }
    html,
    body {
      width: 1280px;
      height: 640px;
      margin: 0;
      overflow: hidden;
    }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 0.84fr 1.16fr;
      gap: 52px;
      padding: 64px 72px;
      background: #faf9f7;
      color: #1a1917;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    body::after {
      position: absolute;
      right: 72px;
      bottom: 44px;
      left: 72px;
      height: 1px;
      background: #e8e4dc;
      content: "";
    }
    .copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 22px;
      font-weight: 600;
    }
    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
    }
    .kicker {
      margin: 54px 0 14px;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 560px;
      margin: 0;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 60px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }
    .subhead {
      max-width: 500px;
      margin: 24px 0 0;
      color: #5a554c;
      font-size: 21px;
      line-height: 1.45;
    }
    .meta {
      margin-top: auto;
      margin-bottom: 10px;
      color: #403d37;
      font-size: 15px;
      font-weight: 500;
    }
    .visual {
      position: relative;
      z-index: 1;
      align-self: center;
    }
    .visual::before {
      position: absolute;
      z-index: -1;
      inset: 40px -28px -28px 44px;
      border: 1px solid #e8e4dc;
      content: "";
    }
    .visual img {
      width: 690px;
      height: 478px;
      border: 1px solid #d5cfc3;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 56px rgba(14, 13, 11, 0.16);
      object-fit: cover;
      object-position: center;
    }
    .url {
      position: absolute;
      z-index: 3;
      right: 72px;
      bottom: 12px;
      color: #5a554c;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="leanmark-mark.svg" alt="">
      <span>LeanMark</span>
    </div>
    <p class="kicker">Markdown viewer · Windows x64</p>
    <h1>Open the README, not the IDE.</h1>
    <p class="subhead">Offline GitHub-flavored Markdown and Mermaid in a focused, MIT-licensed reader.</p>
    <p class="meta">1.34 MiB ZIP · Native C++ host + WebView2</p>
  </div>
  <div class="visual">
    <img src="../site/assets/leanmark-window.png" alt="">
  </div>
  <div class="url">github.com/abooodbah/leanmark</div>
</body>
</html>
