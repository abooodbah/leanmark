name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # The upload step takes ./site wholesale, so anything under it must
      # redeploy. Without this the live page silently lags main: it only ever
      # showed whatever was last dispatched by hand.
      - 'site/**'
      # The site test that gates the deploy.
      - 'tests/Test-Site.ps1'
      # The deployment definition itself, so a correction to this workflow
      # deploys under its own new rules.
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify launch site
        shell: pwsh
        run: ./tests/Test-Site.ps1 -SitePath ./site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
